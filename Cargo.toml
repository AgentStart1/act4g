[package]
name = "gact"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "gact"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
gpui-mobile = { git = "https://github.com/itsbalamurali/gpui-mobile", rev = "5fd54f4554263ae06753e90472c7f2e2ff5d7495" }
gpui = { package = "gpui-pre", version = "=0.3.6", default-features = false }
reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.6" }
reqwest = { package = "gpui-pre-reqwest", version = "0.12.15", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
smol = "2"
pulldown-cmark = { version = "0.13", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
android-activity = { version = "0.6", features = ["native-activity"] }
libc = "0.2"
ndk = { version = "0.9", features = ["nativewindow"] }
jni = "0.22"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
