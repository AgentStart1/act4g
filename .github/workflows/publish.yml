name: Publish Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_FONTCONFIG_DLOPEN: "on"

jobs:
  build:
    name: Build signed Android package
    runs-on: ubuntu-24.04
    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select package type
        id: package
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            {
              echo "build_type=Release"
              echo "artifact_name=gact-${GITHUB_REF_NAME}"
              echo "version_name=${GITHUB_REF_NAME#v}"
              echo "source_apk=android/gradle/app/build/outputs/apk/release/app-release.apk"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "build_type=Alpha"
              echo "artifact_name=gact-alpha-${GITHUB_SHA::7}"
              echo "version_name=0.1.0-alpha.${GITHUB_RUN_NUMBER}"
              echo "source_apk=android/gradle/app/build/outputs/apk/alpha/app-alpha.apk"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Validate publishing credentials
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          for name in \
            CLIENT_ID \
            SIGNING_KEY \
            ALIAS \
            STORE_PASSWORD \
            KEY_PASSWORD
          do
            if [[ -z "${!name}" ]]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 1
            fi
          done

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Install Android NDK r25c
        run: |
          sdkmanager --install "ndk;25.2.9519653"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.4.1"

      - name: Restore signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        shell: bash
        run: printf '%s' "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/gact.jks"

      - name: Build Rust library
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
        run: |
          cargo ndk \
            -t arm64-v8a \
            -P 26 \
            --manifest-path Cargo.toml \
            -o android/gradle/app/src/main/jniLibs \
            build --locked --release

      - name: Build signed APK
        env:
          GACT_KEYSTORE_FILE: ${{ runner.temp }}/gact.jks
          GACT_KEYSTORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          GACT_KEY_ALIAS: ${{ secrets.ALIAS }}
          GACT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GACT_VERSION_CODE: ${{ github.run_number }}
          GACT_VERSION_NAME: ${{ steps.package.outputs.version_name }}
        run: gradle --project-dir android/gradle "assemble${{ steps.package.outputs.build_type }}" --no-daemon

      - name: Verify and stage APK
        env:
          SOURCE_APK: ${{ steps.package.outputs.source_apk }}
          ARTIFACT_NAME: ${{ steps.package.outputs.artifact_name }}
        shell: bash
        run: |
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          if [[ -z "$APKSIGNER" ]]; then
            echo "Android apksigner was not found" >&2
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs "$SOURCE_APK"
          mkdir -p dist
          cp "$SOURCE_APK" "dist/${ARTIFACT_NAME}.apk"

      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: dist/${{ steps.package.outputs.artifact_name }}.apk
          retention-days: 30

  release:
    name: Release APK
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04

    steps:
      - name: Download APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: dist

      - name: Create release when needed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi

      - name: Upload APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" "dist/${ARTIFACT_NAME}.apk" --clobber
