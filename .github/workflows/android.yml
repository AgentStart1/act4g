name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_FONTCONFIG_DLOPEN: "on"

jobs:
  build:
    name: Build APK (arm64-v8a)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK r25c
        run: |
          sdkmanager --install "ndk;25.2.9519653"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.4.1"

      - name: Build Rust library
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
        run: |
          cargo ndk \
            -t arm64-v8a \
            -p 26 \
            --manifest-path Cargo.toml \
            -o android/gradle/app/src/main/jniLibs \
            build --release

      - name: Build APK
        working-directory: android/gradle
        run: gradle assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: act4g-release
          path: android/gradle/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30
